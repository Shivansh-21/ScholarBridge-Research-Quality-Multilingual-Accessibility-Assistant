<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessibility | ScholarBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="accessibility"><div id="sidebar"></div><main class="main">
<header class="topbar"><button class="menu-button" id="menuButton" aria-label="Toggle menu">☰</button><div><p class="eyebrow">Multilingual workspace</p><h1>Multilingual accessibility</h1></div></header>
<section class="grid two"><article class="card"><h2>Document</h2><label for="documentSelect">Select document</label><select id="documentSelect"></select><h3>Original abstract</h3><div id="originalAbstract" class="text-output"></div></article>
<article class="card"><h2>Generate accessible content</h2><label for="languageSelect">Language</label><select id="languageSelect"><option value="Hindi">Hindi</option><option value="Punjabi">Punjabi</option><option value="simple_english">Simplified English</option></select>
<button id="generateButton" class="button primary">Generate AI output</button><div id="translationOutput" class="text-output"></div></article></section>
</main><script src="js/app.js"></script></body></html>
