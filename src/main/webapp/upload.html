<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload | ScholarBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="upload"><div id="sidebar"></div><main class="main">
<header class="topbar"><button class="menu-button" id="menuButton" aria-label="Toggle menu">☰</button><div><p class="eyebrow">Analysis workspace</p><h1>Upload research paper</h1></div></header>
<section class="grid two"><article class="card upload-card"><h2>Select PDF</h2>
<form id="uploadForm"><label class="dropzone" for="pdfFile"><strong>Choose a research paper</strong><span>PDF only · maximum 10 MB</span><input id="pdfFile" name="file" type="file" accept=".pdf,application/pdf" required></label>
<button class="button primary" type="submit">Upload and analyze</button></form><div id="uploadStatus" role="status"></div></article>
<article class="card"><h2>Extraction preview</h2><div id="uploadResult"><p class="muted">Upload a PDF to see its analysis summary.</p></div></article></section>
</main><script src="js/app.js"></script></body></html>
